services:
  # 1. Frontend Web (Nginx) - accedido por Cloudflare Tunnel via Docker DNS
  pixel_frontend:
    image: nginx:alpine
    container_name: pixel_frontend
    restart: unless-stopped
    # Sin ports: el Cloudflare Tunnel (vns_tunnel) accede directamente
    # usando DNS interno de Docker: http://pixel_frontend:80
    volumes:
      # Monta la app compilada (dist) generada por Expo
      - ./dist:/usr/share/nginx/html:ro
      # Monta el archivo de configuración custom de Nginx
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pixel_backend
    networks:
      - pixel_network

  # 2. Node.js Backend - SIN PUERTOS EXPUESTOS
  pixel_backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pixel_backend
    restart: unless-stopped
    environment:
      DB_HOST: pixel_postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-root}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pixel_dev_pass}
      DB_NAME: ${POSTGRES_DB:-bd_pixel}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_HOST: pixel_redis
      REDIS_PORT: 6379
    env_file:
      - .env
    volumes:
      # NOTA: NO montar /app/node_modules — el volumen anónimo sobreescribiría
      # los node_modules instalados en el build de la imagen Docker.
      - ./server/uploads:/app/uploads
      - ./server/videos:/app/videos
      - ./server/hls:/app/hls
    depends_on:
      pixel_postgres:
        condition: service_healthy
      pixel_redis:
        condition: service_started
    networks:
      - pixel_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 3. PostgreSQL Database - SIN PUERTOS EXPUESTOS
  pixel_postgres:
    image: postgres:16-alpine
    container_name: pixel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixel_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bd_pixel}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTA: Los SQL de initdb fueron removidos — las migraciones (node-pg-migrate)
      # crean todo el schema automáticamente al arrancar el backend.

    networks:
      - pixel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-bd_pixel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 4. Redis Caching - SIN PUERTOS EXPUESTOS
  pixel_redis:
    image: redis:7-alpine
    container_name: pixel_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - pixel_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 5. Adminer DB Manager - SIN PUERTOS EXPUESTOS (acceso via Cloudflare Tunnel o SSH)
  pixel_adminer:
    image: adminer:latest
    container_name: pixel_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: pixel_postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - pixel_postgres
    networks:
      - pixel_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pixel_network:
    name: pixel_network
    driver: bridge
