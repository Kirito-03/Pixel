:03:27.701786+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59862,number:5,createdAt:"2026-08-14T16:14:03.333204+00:00"}},{id:4406,title:"Suterare Seijo no Isekai Gohan Tabi: Kakure Skill de Camping Car wo Shoukan shimashita",synopsis:"Rin Takanashi, una cuidadora en sus treintas, fue desechada sin ceremonias como \"basura\" a pesar de haber sido convocada como una santa.\n\nSin embargo, como amante del aire libre y de todo lo relacionado con el camping, fue bendecida con una habilidad especial, [Supervivencia], así como otra habilidad única. Así comienza una emocionante historia: una de sudor, lágrimas y hambre insaciable, mientras Rin, junto a sus compañeros que encontró en el camino, explora este mundo paralelo a su ritmo y saborea la cocina gourmet a su antojo...\n\nO al menos así debería haber ido la historia, pero parece que su camino va en una dirección inesperada... ",poster:null,slug:"suterare-seijo-no-isekai-gohan-tabi-kakure-skill-de-camping-car-wo-shoukan-shimashita",startDate:"2026-07-06",createdAt:"2026-07-06 12:39:58.545265+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59903,number:7,createdAt:"2026-08-17T15:58:10.300564+00:00"}},{id:4413,title:"Tefuda ga Oome no Victoria",synopsis:"En una época en la que los espías actúan tras bambalinas en cada país, Chloe pasa sus días llevando a cabo con éxito incluso las misiones más difíciles, gracias a sus inigualables habilidades de disfraz y artes marciales. Sin embargo, tras la traición de su jefe, desaparece repentinamente, ya que Chloe planea rehacer su vida como la ciudadana ordinaria Victoria en el reino vecino de Ashberry, esforzándose por llevar una vida \"normal\". No obstante, la vida pacífica de Victoria se ve abruptamente interrumpida a medida que comienza a involucrarse con muchas personas. En esta nueva tierra, sus experiencias y habilidades de sus días como espía resultan ser mucho más útiles de lo que jamás imaginó. Por otro lado, el segundo príncipe y los perseguidores de la organización, entre otros, se interesan por la fortaleza de Victoria, y muchas sombras se ciernen sobre quien tiene todas las cartas en la mano...!",poster:null,slug:"tefuda-ga-oome-no-victoria",startDate:"2026-07-08",createdAt:"2026-07-07 13:15:30.072924+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59911,number:7,createdAt:"2026-08-18T15:21:33.616573+00:00"}},{id:4429,title:"Bleach: Sennen Kessen-hen - Kashin-tan",synopsis:"Parte final de Bleach: Sennen Kessen-hen.",poster:null,slug:"bleach-sennen-kessen-hen-kashin-tan",startDate:"2026-07-25",createdAt:"2026-07-25 14:51:47.333703+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59872,number:4,createdAt:"2026-08-15T14:54:00.444707+00:00"}},{id:3833,title:"Steel Ball Run: JoJo no Kimyou na Bouken",synopsis:"En el Viejo Oeste Americano, la mayor carrera del mundo está a punto de comenzar. Miles de personas se alinean en San Diego para recorrer más de seis mil kilómetros por la oportunidad de ganar el gran premio de cincuenta millones de dólares. Con la era del caballo llegando a su fin, se permite a los concursantes usar cualquier tipo de vehículo que deseen. Los competidores tendrán que soportar condiciones agotadoras, viajando hasta cien kilómetros al día a través de desiertos inexplorados. La Steel Ball Run es, sin duda, un evento único en su tipo.\n\nEl joven Johnny Joestar, un ex corredor de caballos discapacitado, ha venido a San Diego para presenciar el inicio de la carrera. Allí se encuentra con Gyro Zeppeli, un corredor que lleva dos bolas de acero en la cintura en lugar de un arma. Johnny observa cómo Gyro utiliza una de sus bolas de acero para desatar un poder fantástico, obligando a un hombre a dispararse a sí mismo durante un duelo. En medio de la acción, Johnny toca accidentalmente la bola de acero y siente un poder surgiendo a través de sus piernas, lo que le permite levantarse por primera vez en dos años. Prometiendo encontrar el secreto de las bolas de acero, Johnny decide participar en la carrera, y así comienza su extraña aventura a través de América en la Steel Ball Run. ",poster:null,slug:"steel-ball-run-jojo-no-kimyou-na-bouken",startDate:"2026-03-19",createdAt:"2026-03-19 12:24:04.841667+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:53160,number:1,createdAt:"2026-03-19T12:31:39.994708+00:00"}},{id:4373,title:"Bungou Stray Dogs Wan! 2",synopsis:"Segunda temporada de Bungou Stray Dogs Wan!.",poster:null,slug:"bungou-stray-dogs-wan-2",startDate:"2026-07-02",createdAt:"2026-07-02 13:48:22.543126+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59848,number:7,createdAt:"2026-08-13T13:19:12.980174+00:00"}},{id:4381,title:"Kore Kaite Shine",synopsis:"Ai Yasumi, una estudiante de primer año de secundaria que vive en Izu-Oshima, ama el manga más que nada. Cuando se entera de que su artista de manga favorito, Hoshi no Rei, a quien ha admirado durante mucho tiempo pero que ha estado inactivo, expondrá en COMITIA, se embarca en un viaje a Tokio.\n\nSin embargo, lo que no espera es que un encuentro fatídico en el evento cambiará su vida para siempre.\n\n\"¿Cómo se convierte uno en un artista de manga?\" Ai entra en el mundo de la creación de manga, un camino que pensaba que entendía, pero del que en realidad sabe muy poco. Esta es la historia de una chica que da sus primeros pasos en el camino para convertirse en mangaka.",poster:null,slug:"kore-kaite-shine",startDate:"2026-07-03",createdAt:"2026-07-03 13:04:07.97242+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59784,number:6,createdAt:"2026-08-07T15:51:32.256326+00:00"}},{id:4401,title:"Sayonara Lara",synopsis:"Hace mucho, mucho tiempo, vivía una princesa sirena llamada Lara. Fue criada con amor por su padre, el rey del mar, y sus hermanas. Un día, Lara se enamoró de un príncipe humano que vivía en la tierra. Era un amor prohibido, uno que no estaba permitido en el mundo de las sirenas. Aun así, Lara viajó a la superficie. Con una poción, que le dio la bruja Grace, se convirtió en humana. Pero la poción tenía un precio: si no encontraba el amor verdadero, se convertiría en espuma y desaparecería en el océano. Aunque era una princesa del mar, Lara eligió el amor. Sin embargo, su deseo no se cumplió y ella desapareció en el mar. Doscientos años después, Lara despierta una vez más, en el Lago Biwa, para finalmente buscar a su verdadero amor. ",poster:null,slug:"sayonara-lara",startDate:"2026-07-06",createdAt:"2026-07-05 14:32:25.594414+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59892,number:7,createdAt:"2026-08-16T15:36:54.185202+00:00"}},{id:4414,title:"Koukaku Kidoutai (TV)",synopsis:"En el año 2029, la ciudad de Niihama se ha convertido en una metrópolis tecnológicamente avanzada. Debido a grandes mejoras en cibernética, sus ciudadanos pueden reemplazar sus extremidades por partes robóticas. El mundo está ahora más interconectado que nunca, y la Sección de Seguridad Pública 9 de la ciudad es responsable de combatir la corrupción, el terrorismo y otras amenazas peligrosas tras este cambio hacia la globalización.\n\nLa decidida Mayor Motoko Kusanagi de la Sección 9 lidera un caso que involucra a un misterioso hacker conocido únicamente como el \"Maestro de Marionetas,\" que deja tras de sí un rastro de víctimas despojadas de sus recuerdos. Al igual que muchos en este mundo futurista, el cuerpo del Maestro de Marionetas es casi totalmente robótico, dándole un poder increíble.\n\nMientras Motoko y sus subordinados siguen el rastro del enigmático criminal, otras partes, incluida la Sección 6, comienzan a involucrarse, lo que obliga a Motoko a confrontar la naturaleza extremadamente complicada del caso. Reflexionando sobre diversas preguntas filosóficas, como el significado de su propia vida, Motoko pronto se da cuenta de que quien proporcionará estas respuestas no es otro que el Maestro de Marionetas en sí. ",poster:null,slug:"koukaku-kidoutai-tv",startDate:"2026-07-07",createdAt:"2026-07-07 13:18:52.340627+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59909,number:7,createdAt:"2026-08-18T14:53:59.879852+00:00"}},{id:4418,title:"Ibitte Konai Gibo to Gishi",synopsis:"Miya es la hija ilegítima de una familia prominente. Cuando su madre muere, está convencida de que sabe lo que le espera en su nuevo hogar: ¡una vida de servidumbre y miseria a manos de su malvada madrastra y sus hermanastras! Sin embargo, cuando finalmente conoce a las mujeres que espera que la traten como a basura, ¡en realidad terminan siendo... dulce?! ",poster:null,slug:"ibitte-konai-gibo-to-gishi",startDate:"2026-07-08",createdAt:"2026-07-08 11:49:56.887053+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59917,number:7,createdAt:"2026-08-19T15:13:49.763951+00:00"}},{id:4423,title:"Mebius Dust",synopsis:"Diez años después de que un misterioso meteorito cayera a la Tierra, las personas llamadas \"Portadores de Rams\" desarrollan habilidades sobrehumanas conocidas como \"Rams\". Sin embargo, aquellos que adquieren estas habilidades especiales solo pueden sobrevivir en presencia del \"Polvo Mebius\" liberado por un cristal gigante, y por lo tanto, se les prohíbe salir de la ciudad de Shinkatsushika.\n\nDentro de Shinkatsushika, los niños Portadores de Rams utilizan sus Rams para jugar a un juego de conquista de territorio que alivia su aburrimiento por no poder salir de la ciudad. El estudiante de secundaria Araki, junto con su hermana menor, Stella, y su amiga de la infancia, Olga, forman un equipo llamado \"Polis Hopper\" y se lanzan al juego. Sus destinos comienzan a cambiar cuando el Profesor Yuda, un investigador que estudia los Rams, les pide participar en un experimento determinado...",poster:null,slug:"mebius-dust",startDate:"2026-07-09",createdAt:"2026-07-09 13:44:12.655181+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59851,number:6,createdAt:"2026-08-13T15:18:33.507595+00:00"}},{id:4375,title:"Tsuihou sareta Tensei Juukishi wa Game Chishiki de Musou suru",synopsis:"\"¡Hijo inútil! Se suponía que debías convertirte en un maestro espadachín, ¡pero nunca pensé que sería tan trágico!\"\n\nEl día que un niño cumple quince años, se somete al Ritual de la Bendición Divina. Ya descendiente de una línea de maestros espadachines, Elymas debía suceder a su padre. Sin embargo, le toca la clase defectuosa, el Caballero Pesado, y no solo pierde su estatus como futuro jefe del hogar, sino que también es exiliado. Con sus estadísticas desbalanceadas y habilidades aparentemente inútiles, los Caballeros Pesados son considerados una clase para cobardes y perezosos. Sin embargo, Elymas conoce la verdad. El mundo en el que vive es el mismo que el del juego que solía jugar... Y es el Caballero Pesado el que es la clase más poderosa de todas. Usando recuerdos de su vida pasada, Elymas ha decidido conquistar este mundo por completo.",poster:null,slug:"tsuihou-sareta-tensei-juukishi-wa-game-chishiki-de-musou-suru",startDate:"2026-07-03",createdAt:"2026-07-02 14:21:58.757961+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59854,number:7,createdAt:"2026-08-13T16:24:39.099014+00:00"}},{id:4376,title:"Otome Kaijuu Caraméliser",synopsis:"Kuroe Akaishi es una chica de secundaria introvertida, callada y aparentemente normal. Aunque está acostumbrada a estar sola, sus días sombríos comienzan a cambiar cuando conoce a Arata Minami, un chico brillante y guapo de su clase. A pesar de su estatus popular, él es lo suficientemente amable como para acercarse a una marginada como ella; pronto, Kuroe descubre que su corazón comienza a latir con fuerza a su alrededor.\n\nSigue latiendo y latiendo y latiendo hasta que Kuroe se transforma en un monstruoso kaijuu. Tiene una cierta afección: a medida que crece su vergüenza, también lo hacen los apéndices monstruosos de su cuerpo; y cuando alcanza su punto máximo, desata toda la extensión de su transformación.\n\nAl mismo tiempo, la belleza se encuentra con el kaijuu, y Japón se enfrenta a la inminente amenaza del misterioso monstruo. ¿Podrá Minami aceptar sus sentimientos, o también se asustará ante su forma colosal? Dependiendo de su decisión, el mundo puede experimentar la devastación total del amor juvenil y palpitante de una chica. ",poster:null,slug:"otome-kaijuu-carameliser",startDate:"2026-07-03",createdAt:"2026-07-02 14:26:29.843854+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59855,number:7,createdAt:"2026-08-13T17:39:46.787057+00:00"}},{id:4434,title:"Shiguang Dailiren III",synopsis:"Después de que el incidente de Li Tianchen llegara a su fin, el Estudio Fotográfico Time volvió a una paz superficial. Sin embargo, la noticia de la desaparición de Xia Fei volvió a atraer a todos a un cruce de caminos del destino. Con el regreso de Vein y el despertar de sus superpoderes por parte de Qiao Ling, Cheng Xiaoshi y Lu Guang comienzan a descubrir gradualmente los secretos del caso del incendio de Bahati, y el padre de Cheng Xiaoshi, Cheng Weimin, y su madre, Shao Yuanyuan, también parecen tener conexiones complicadas con ello. A medida que la investigación se profundiza, Liu Xiao, de una organización misteriosa, inicia su operación, y la intervención del oficial de policía de Yingdu, Jae, complica aún más esta búsqueda de la verdad...",poster:null,slug:"shiguang-dailiren-iii",startDate:"2026-08-14",createdAt:"2026-08-14 13:47:05.48571+00",category:{id:3,name:"OVA"},latestEpisode:{id:59858,number:2,createdAt:"2026-08-14T13:59:06.822611+00:00"}},{id:4378,title:"Bai Ri Cheng Wang",synopsis:"Un segundo, el restaurante estaba lleno de alegría; al siguiente, se convirtió en un río de sangre... El rey, que claramente amaba a su pueblo, de pronto se convirtió en una bestia sedienta de sangre... \"Ming\" ha perdido a todos los que le importaban; ¡este terrible rey es realmente horrible! ¡Tomaré mi venganza! Espera, ¿quieres decir que el alma frente a mí, que solo tiene 100 días para vivir, es el verdadero \"Lie\"? ¡Está bien, está bien! 100 días—¡coronémonos reyes juntos!",poster:null,slug:"bai-ri-cheng-wang",startDate:"2026-07-03",createdAt:"2026-07-03 12:53:41.773673+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59905,number:17,createdAt:"2026-08-18T14:03:02.598811+00:00"}},{id:4379,title:"Koko wa Ore ni Makasete Saki ni Ike to Itte kara 10-nen ga Tattara Densetsu ni Natteita.",synopsis:"El hechicero Luck cree que este es el final. Asediado por poderosos demonios, hace el noble sacrificio de contener su embestida mientras sus amigos escapan. Sin dormir ni descansar, Luck soporta el choque de espadas, la lluvia de sangre y el interminable río de enemigos. Contra todo pronóstico, vence al comandante y emerge victorioso, solo para descubrir que han pasado 10 años enteros en el transcurso. Además, su cuerpo ha retrocedido en edad hasta el punto en que parece un simple adolescente.\n\nTras su triunfo, Luck pronto se reúne con sus amigos, el héroe Eric Imgard Mendirival y el guerrero Goran Morton. Como pensaban que Luck estaba muerto, la pareja se aseguró de que su historia quedara registrada como un héroe y se preparó para aplacar el ascenso de los mismos demonios, sin conocer la hazaña de Luck. Con todo esto en mente, Luck solo desea una vida tranquila, por lo que se presenta como un aventurero novato bajo el nombre de Lock y se embarca en un viaje junto a nuevos compañeros. ",poster:null,slug:"koko-wa-ore-ni-makasete-saki-ni-ike-to-itte-kara-10-nen-ga-tattara-densetsu-ni-natteita",startDate:"2026-07-06",createdAt:"2026-07-03 12:59:24.507395+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59860,number:7,createdAt:"2026-08-14T14:17:15.352323+00:00"}},{id:3977,title:"Kami no Shizuku",synopsis:"Shizuku Kanzaki es el único hijo del renombrado crítico de vino Yutaka Kanzaki. Desde joven, Shizuku ha estado sujeto a una extraña educación por parte de su padre, todo por el bien del vino. Desde aprender a decantar una bebida con gracia hasta recordar intensamente el olor de cinturones de cuero y lápices, el entrenamiento le genera rencor hacia todo lo relacionado con el vino. Descontento con su padre, deja el hogar para convertirse en un representante de ventas promedio en una empresa de cerveza, negándose a tocar el vino nuevamente.\n\nCuando su padre fallece de repente, Shizuku se ve arrastrado de nuevo al mundo que tanto odia. Como parte de la voluntad de su padre, quien heredará su valiosa colección de vinos y su propiedad será la persona que pueda identificar correctamente a los \"12 Apóstoles\" de los vinos, así como las legendarias \"Gotas de Dios\". Para heredar los bienes, Shizuku tiene un año para completar la tarea, pero considera la propuesta ridícula, ya que es el único pariente vivo de Yutaka.\n\nLo que Yutaka no le dijo a su hijo antes de morir es que había adoptado a Issei Tomine en la familia una semana antes de su fallecimiento. Issei es un famoso crítico de vino veterano que compite contra Shizuku para reclamar la propiedad para sí mismo. Sin una formación formal en cata de vinos, Shizuku no tiene ninguna oportunidad contra \"El Príncipe del Vino\" y corre el riesgo de perderlo todo en esta competencia. ¿Podrá identificar correctamente las esquivas \"Gotas de Dios\" antes de que se le acabe el tiempo?",poster:null,slug:"kami-no-shizuku",startDate:"2026-04-10",createdAt:"2026-04-10 12:25:11.184459+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59866,number:19,createdAt:"2026-08-14T23:39:29.427842+00:00"}},{id:4387,title:"Iwamoto-senpai no Suisen",synopsis:"La década de 1910. Iwamoto Kodo, un estudiante de la Escuela Secundaria Suho bajo el mando directo del ejército, está investigando fenómenos paranormales en todo el país según las instrucciones militares. En un pueblo del que se rumorea que tiene \"nieve negra,\" conoce a un niño con poderes especiales que cree que son una enfermedad; a través del apoyo de Iwamoto, se da cuenta de que podrían tener algo en común y recibe una recomendación para la escuela. ¡Los misterios aguardan a Iwamoto en cada lugar que visita, mientras se comienza a desvelar una historia de amor de esta época!",poster:null,slug:"iwamoto-senpai-no-suisen",startDate:"2026-07-04",createdAt:"2026-07-04 12:56:00.123471+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59871,number:7,createdAt:"2026-08-15T14:19:07.307534+00:00"}},{id:4389,title:"Grow Up Show: Himawari no Circus-dan",synopsis:"En Japón, durante el apogeo de su boom económico a mediados de la década de 1950, el circo era una forma de entretenimiento que se convirtió en una parte central de la vida de muchas personas. Las mejores compañías tienen permiso para participar en el festival \"Circus Collection\", de renombre mundial, y muchos vienen de todo Japón para competir diariamente.\n\nLa historia se centra en la luchadora compañía \"Circo Girasol\", dirigida por la maestra de ceremonias María, y una nueva prodigio que se une a sus filas por razones desconocidas: Mizuka Tsurumaki.\n\n¿Es su encuentro con los miembros tan singulares de la compañía Circo Girasol una coincidencia o un destino? ¡Comienza este espectáculo circense único que muestra a jóvenes persiguiendo sus sueños!",poster:null,slug:"grow-up-show-himawari-no-circus-dan",startDate:"2026-07-05",createdAt:"2026-07-04 12:57:44.874921+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59873,number:7,createdAt:"2026-08-15T16:23:56.109064+00:00"}},{id:3933,title:"Yomi no Tsugai",synopsis:"En un pueblo aislado, nacen dos gemelos, separados por el día y la noche. Años después, mientras el hermano mayor, Yuru, se ha convertido en un cazador de animales, su hermana Asa ha sido encerrada en una jaula, obligada a cumplir un deber especial que le prohíbe interactuar con más que unos pocos individuos seleccionados.\n\nEn un día que, de otro modo, sería inconspicuo, un grupo de hombres armados que llegan en helicópteros, conocidos como \"dragones\" por los ciudadanos, asalta el pueblo en busca de Yuru, matando a todos los adultos a la vista. Cuando Yuru intenta reunirse con Asa y huir, en su lugar encuentra un cadáver; además, la persona que la mató afirma ser la verdadera hermana gemela de Yuru.\n\nAntes de que la mujer pueda capturarlo, Yuru es rescatado por un hombre llamado Dera, un forastero que visita el pueblo con frecuencia. Sin embargo, no pasa mucho tiempo antes de que ambos queden acorralados. En un último esfuerzo, Dera hace que Yuru ofrezca un regalo a la deidad del pueblo, invocando un par de demonios cuya existencia está destinada a revelar la verdad detrás de estos caóticos eventos.",poster:null,slug:"yomi-no-tsugai",startDate:"2026-04-04",createdAt:"2026-04-04 13:20:23.194252+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59874,number:19,createdAt:"2026-08-15T16:24:19.555851+00:00"}},{id:4388,title:"Tenmaku no Jaadugar",synopsis:"En el harén del Kan, la sabiduría es belleza. La época: el siglo XIII. El lugar: Yeke Mongol Ulus, el mayor imperio que el mundo ha conocido. La mujer: Fatima, proveniente de Persia, donde la técnica médica y el conocimiento científico se han perfeccionado más allá de todo precedente. El deseo de Fatima por un escenario donde pueda aplicar su conocimiento la ha llevado al palacio de los mongoles, donde cae bajo la protección de Töregene, la sexta esposa de Ögedei, el segundo Gran Kan—una mujer poderosa con sentimientos complicados sobre la dirección del imperio. Estas dos mujeres son el eje sobre el cual girarán la política del palacio y, pronto, del mundo entero... \n",poster:null,slug:"tenmaku-no-jaadugar",startDate:"2026-07-04",createdAt:"2026-07-04 12:57:23.477021+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59875,number:8,createdAt:"2026-08-15T16:25:19.513036+00:00"}},{id:4390,title:"Oni no Hanayome",synopsis:"\"¡Eres la novia que he estado buscando todo este tiempo!\"\n\n¡Una historia de Cenicienta al estilo japonés! Los ayakashi y los humanos coexisten en armonía. Los ayakashi, que tienen habilidades superiores y apariencias hermosas, a veces encuentran a su pareja entre las mujeres humanas, convirtiéndolas en su \"novia\". A cambio de traer prosperidad, la novia recibe amor absoluto por parte del ayakashi.\n\nYuzu es constantemente comparada con su hermana, una novia de un zorro demonio, y su familia la resentía cada día. Un día, cuando Yuzu ya no podía soportar más las cosas, un hombre apareció ante ella en un puente. Este hombre es el más hermoso que Yuzu ha visto jamás... ¡y la está llamando su esposa?!\n\n\"Solo cállate y déjame abrazarte.\" ¿El ayakashi más poderoso y \"frío\" está derramando su corazón por Yuzu?! ",poster:null,slug:"oni-no-hanayome",startDate:"2026-07-05",createdAt:"2026-07-04 12:58:49.141847+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59876,number:7,createdAt:"2026-08-15T17:24:50.972526+00:00"}},{id:4386,title:"Black Torch",synopsis:"Jirou Azuma, un adolescente de diecisiete años, lleva una vida tranquila con su abuelo, utilizando su habilidad sobrenatural de hablar con los animales para hacer amigos y protegerlos. Tanto Jirou como su abuelo son descendientes de un antiguo clan shinobi, entrenando en combate para mantener el arte de la batalla vivo en su familia. La vida de Jirou se ve sacudida después de rescatar a un aparentemente normal gato negro, Ragou, solo para descubrir que el gato es en realidad un mononoke—un espíritu demoníaco que ha estado en guerra con la humanidad durante mucho tiempo. Cuando un mononoke hostil viene en busca de Ragou, Jirou utiliza su entrenamiento shinobi para defender al gato, pero sufre inmediatamente una herida mortal.\n\nFrente a la decisión de devorar la energía menguante de Jirou y restaurarse a su plena potencia, Ragou elige en su lugar darle su energía restante a Jirou. Al revivir al chico, la transferencia también le concede grandes poderes sobrenaturales que complementan su propio estilo de lucha shinobi. Este acto es presenciado por Ryousuke Shiba, un oficial de la Oficina de Espionaje cuyo trabajo gira en torno a despachar mononoke agresivos. Shiba extiende a Jirou y su abuelo una oferta: unirse al nuevo escuadrón de la Oficina, Black Torch, y ayudarles a combatir poderosos mononoke que buscan devorar a personas inocentes.",poster:null,slug:"black-torch",startDate:"2026-07-04",createdAt:"2026-07-04 12:55:32.701462+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59869,number:7,createdAt:"2026-08-15T13:08:05.318331+00:00"}},{id:4391,title:"Mahou Shoujo Lyrical Nanoha EXCEEDS: Gun Blaze Vengeance",synopsis:"Hace treinta años, la aparición repentina de formas de vida alienígenas invasoras desconocidas estuvo a punto de traer el fin del mundo.\n\nDesde entonces, la humanidad y estas criaturas, conocidas como Especies Invasoras, han continuado chocando por el territorio habitable. Aunque la seguridad humana apenas se mantiene, el mundo sigue al borde del colapso. Mientras la amenaza de muerte y destrucción persiste, la gente continúa con sus vidas diarias alejándose del peligro constante que los rodea. En respuesta, las Naciones Unidas establecen EXCEEDS, una organización encargada de investigar y combatir las amenazas causadas por las Especies Invasoras.\n\nLa historia comienza en la nación insular del Lejano Oriente llamada Mizuho, donde Shiina Kuze, una joven cazadora que extermina especies invasoras, vive en una isla remota. Deseando nada más que una vida tranquila con su única familia—su hermana menor, Setsuna—la rutina de Shiina se ve interrumpida cuando ocurre un incidente inesperado, involucrándola en un conflicto mucho más grande.",poster:null,slug:"mahou-shoujo-lyrical-nanoha-exceeds-gun-blaze-vengeance",startDate:"2026-07-05",createdAt:"2026-07-04 13:00:29.854449+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59877,number:7,createdAt:"2026-08-15T17:25:07.92698+00:00"}},{id:4425,title:"Hanaori-san wa Tensei shitemo Kenka ga Shitai",synopsis:"Narukami Ryusei es un típico NEET. Pasa sus días encerrado en su habitación jugando videojuegos sin preocuparse por el mundo, llevando una vida perezosa. Pero la verdad es que Ryusei solía ser un poderoso rey demonio en otro mundo. Entonces, ¿por qué no pasar esta nueva vida haciendo lo que le plazca? Excepto que no fue el único reencarnado en este mundo. ¡La heroína que lo derribó también está aquí, y es una chica de secundaria realmente adorable! ¿Podrá Ryusei sobrevivir al reencuentro con su enemigo en un nuevo mundo, o se encontrará luchando incluso en esta vida? ",poster:null,slug:"hanaori-san-wa-tensei-shitemo-kenka-ga-shitai",startDate:"2026-07-12",createdAt:"2026-07-11 14:01:43.077978+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59879,number:6,createdAt:"2026-08-15T18:04:32.172542+00:00"}},{id:4393,title:"Saijo no Osewa: Takane no Hanadarake na Meimonkou de, Gakuin Ichi no Ojousama (Seikatsu Nouryoku Kaimu) wo Kagenagara Osewa suru Koto ni Narimashita",synopsis:"Hinako Konohana es la joven perfecta: elegante, graciosa e impecable... o eso es lo que todos piensan. Detrás de puertas cerradas, es un completo desastre que no puede manejar las tareas básicas del hogar. Cuando el estudiante común Itsuki Tomonari se convierte en su cuidador, se ve sumido en un control de daños las 24 horas, manteniendo su imagen \"perfecta\". Es una situación incómoda y caótica, pero comienza a transformarse en algo que se siente como amor... ",poster:null,slug:"saijo-no-osewa-takane-no-hanadarake-na-meimonkou-de-gakuin-ichi-no-ojousama-seikatsu-nouryoku-kaimu-wo-kagenagara-osewa-suru-koto-ni-narimashita",startDate:"2026-07-05",createdAt:"2026-07-04 13:06:31.862723+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59881,number:7,createdAt:"2026-08-15T18:26:48.173523+00:00"}},{id:3935,title:"Mao",synopsis:"Nanoka atraviesa un portal hacia la era Taisho, donde el exorcista Mao, a regañadientes, la rescata de las garras de un grotesco yokai. Cuando Nanoka regresa al presente, descubre que tiene algunas nuevas y increíbles habilidades. Regresa al pasado en busca de respuestas, solo para verse envuelta en la investigación de Mao sobre una serie de asesinatos espeluznantes. A medida que sus preguntas sobre sí misma se multiplican, Nanoka descubre que Mao está maldito por un demonio gato llamado Byoki, y también lo está su espada. Si alguien que no sea Mao intenta empuñarla, está condenado. Pero cuando la vida de Mao está en peligro, ¡Nanoka toma su espada y ataca! ",poster:null,slug:"mao",startDate:"2026-04-04",createdAt:"2026-04-04 18:17:56.938294+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59882,number:20,createdAt:"2026-08-15T21:46:46.716079+00:00"}},{id:4398,title:"Sekai Saikyou no Kouei: Meikyuukoku no Shinjin Tansakusha",synopsis:"La muerte del esclavo corporativo Arihito Atobe en un extraño accidente de autobús marca el inicio de su nueva vida como una especie de aventurero llamado Buscador. Renacido en un mundo de fantasía, se adapta a una clase de trabajo previamente desconocida llamada \"retaguardia\", capaz de proporcionar a su grupo (todo femenino) un apoyo crítico en ataque, defensa y recuperación. Y viene con un beneficio adicional: ¡simplemente estar al final de la fila del grupo aumenta el cariño de sus compañeras hacia él! Liberado de las cadenas de la vida corporativa, Arihito está ansioso por empezar de nuevo como un recién convertido Buscador. ",poster:null,slug:"sekai-saikyou-no-kouei-meikyuukoku-no-shinjin-tansakusha",startDate:"2026-07-05",createdAt:"2026-07-05 13:58:12.15416+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59887,number:7,createdAt:"2026-08-16T13:44:23.907011+00:00"}},{id:4400,title:"Nijusseiki Denki Mokuroku: Eureka Evrika",synopsis:"En una versión alterna de principios del siglo XX, donde el progreso tecnológico evolucionó por un camino diferente moldeado por la energía del vapor, Kioto está cubierto de un humo constante.\n\nUn chico, endurecido por la pérdida de su hermano, se vuelve desconfiado después de que su sueño compartido de una \"Era de la Electricidad\" se ve truncado. Una chica profundamente devota oculta sus sueños y arrepentimientos por su madre fallecida en lo más profundo de su corazón. Cuando sus caminos se cruzan, se embarcan en la exploración de los secretos del Catálogo Eléctrico del siglo XX, un atisbo del futuro que tanto anhelan.\n\nJuntos, deben confrontar sus pasados y forjar un camino hacia el futuro en el que una vez creyeron.",poster:null,slug:"nijusseiki-denki-mokuroku-eureka-evrika",startDate:"2026-07-05",createdAt:"2026-07-05 14:23:44.970682+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59889,number:7,createdAt:"2026-08-16T14:23:45.519819+00:00"}},{id:3987,title:"Kuroneko to Majo no Kyoushitsu",synopsis:"La Academia Real Diana es una prestigiosa institución que acepta a individuos con excepcionales habilidades mágicas. Al graduarse, estos estudiantes se encuentran en la cima de su campo o empleados por la familia real. Spica Virgo sueña con estudiar en la academia, con el objetivo de convertirse en una gran hechicera como su ídolo Claude Sirius. Claude es un hechicero de renombre mundial que se convirtió en el instructor más joven de la institución, pero desapareció misteriosamente poco después.\n\nCareciendo de la experiencia y las conexiones necesarias para ser admitida, Spica se siente incapaz de hacer progresos significativos en su entrenamiento. Sin embargo, un día se encuentra con un gato negro parlante con habilidades mágicas. Con la esperanza de cambiar la situación para mejor, le suplica al animal que la tome como su aprendiz y le enseñe la magia que necesita para asistir a la academia. El gato acepta el trato con una condición: debe encontrar una manera de revertir su maldición felina. A pesar de los arduos desafíos que tiene por delante, Spica está decidida a demostrar que es una estudiante digna de la mentoría del gato.",poster:null,slug:"kuroneko-to-majo-no-kyoushitsu",startDate:"2026-04-12",createdAt:"2026-04-12 10:23:38.286202+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59891,number:19,createdAt:"2026-08-16T15:14:11.221455+00:00"}},{id:4426,title:"Futsutsuka na Akujo dewa Gozaimasu ga: Suuguu Chouso Torikae Den",synopsis:"Dentro del opulento tribunal interno del Reino de Ei se encuentra la próspera Corte de las Doncellas, donde la emperatriz y las cuatro consortes imperiales son elegidas de cinco clanes prominentes. Entre ellas, una consorte en formación, Reirin Kou, se destaca como la candidata perfecta para la futura emperatriz. Su virtud y elegancia son incomparables, y es impecable, salvo por su extremadamente frágil constitución. En comparación con la delicada mariposa de la corte, la grosera Keigetsu Shu es como una rata de alcantarilla. Siempre mirando a Reirin con amarga envidia, Keigetsu es una deshonra para la Corte de las Doncellas.\n\nDurante la noche de una rara aparición de un cometa, los celos de Keigetsu alcanzan su punto máximo y ella intenta asesinar a Reirin empujándola desde un balcón. Reirin es rápidamente salvada de la muerte, y Keigetsu es encarcelada a la espera de su ejecución. Sin que nadie lo sepa, Keigetsu ha lanzado un hechizo para intercambiar cuerpos con Reirin con el fin de robar todo lo que le pertenece. Pero mientras Keigetsu se ve obstaculizada por el frágil cuerpo de Reirin, esta última abraza por primera vez la libertad y la fuerza física, decidida a vivir, sin importar a quién pertenezca su rostro.",poster:null,slug:"futsutsuka-na-akujo-dewa-gozaimasu-ga-suuguu-chouso-torikae-den",startDate:"2026-07-12",createdAt:"2026-07-12 10:18:09.782266+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59893,number:6,createdAt:"2026-08-16T15:54:00.973232+00:00"}},{id:197,title:"One Piece",synopsis:"Apenas sobreviviendo en un barril tras pasar por un terrible remolino en el mar, el despreocupado Monkey D. Luffy termina a bordo de un barco bajo ataque de temibles piratas. A pesar de parecer un adolescente ingenuo, no se le debe subestimar. Inigualable en combate, Luffy es un pirata que persigue resueltamente el codiciado tesoro de One Piece y el título de Rey de los Piratas que lo acompaña.\n\nEl difunto Rey de los Piratas, Gol D. Roger, agitou al mundo antes de su muerte al revelar la ubicación de su tesoro y desafiar a todos a conseguirlo. Desde entonces, innumerables poderosos piratas han navegado por mares peligrosos en busca del preciado One Piece, solo para nunca regresar. Aunque Luffy carece de una tripulación y de un barco adecuado, posee una habilidad sobrehumana y un espíritu indomable que lo convierten no solo en un formidable adversario, sino también en una inspiración para muchos.\n\nMientras enfrenta numerosos desafíos con una gran sonrisa en su rostro, Luffy reúne compañeros únicos para unirse a él en su ambicioso empeño, abrazando juntos los peligros y maravillas en su aventura única en la vida. ",poster:null,slug:"one-piece",startDate:"1999-10-20",createdAt:"2025-02-22 07:34:09.266305+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59894,number:1174,createdAt:"2026-08-16T16:56:01.064611+00:00"}},{id:4404,title:"Toumei na Yoru ni Kakeru Kimi to, Me ni Mienai Koi wo Shita.",synopsis:"En una noche de abril en Tokio, aún demasiado temprano para los fuegos artificiales, el estudiante universitario Kakeru Mano conoce a una mujer llamada Koharu Fuyutsuki. Ella es una chica hermosa que se destaca entre la multitud, ríe mucho y irradia una calidez que contrasta marcadamente con la propia introversión de Kakeru. Pero había algo que Kakeru no sabía al principio: ella no puede ver. A diferencia de Kakeru, Koharu no ha renunciado a nada, incluso con su ceguera. Asiste a la universidad todos los días, muestra interés en los clubes, hace amigos, y sueña con lanzar fuegos artificiales algún día. Kakeru se pregunta por qué, si no puede verlos... pero tal vez no importa. Y tal vez él también puede comenzar a avanzar, por la chica que siempre ha estado a su lado. ",poster:null,slug:"toumei-na-yoru-ni-kakeru-kimi-to-me-ni-mienai-koi-wo-shita",startDate:"2026-07-06",createdAt:"2026-07-06 12:23:06.359354+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59896,number:7,createdAt:"2026-08-17T13:37:57.232181+00:00"}},{id:4403,title:"Saikyou Degarashi Ouji no Anyaku Teii Arasoi",synopsis:"El imperio Adrasia en el continente Vogel. Hay una batalla por el trono de un imperio que posee un poderoso ejército y un vasto territorio. Con el sucesor aún sin decidir, los hijos del emperador luchan por expandir su poder. Sin embargo, hay un príncipe que todos dicen que definitivamente no se convertirá en emperador: el séptimo príncipe, Arnold Lakes Adler. El joven que es inferior a su hermano gemelo menor en todos los aspectos, el príncipe aburrido. Incompetente y perezoso, Arnold desperdicia cada día simplemente divirtiéndose. Sin embargo, tras bambalinas, es uno de los cinco aventureros de Clase SS llamados \"Plata\". Al ver la intensificación de la batalla por el trono, decidió: \"No quiero morir, así que dejemos que mi hermano menor se convierta en el emperador...\" Esta es la historia de los absurdos movimientos secretos del príncipe que no está interesado en el título de emperador.",poster:null,slug:"saikyou-degarashi-ouji-no-anyaku-teii-arasoi",startDate:"2026-07-06",createdAt:"2026-07-06 12:19:04.642934+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59898,number:7,createdAt:"2026-08-17T13:38:39.164212+00:00"}},{id:4368,title:"World Is Dancing",synopsis:"No se necesita la danza para vivir.\n\nEn 1374, durante la turbulenta época en que las Cortes del Norte y del Sur estaban en conflicto, el shogun de la Corte del Norte, Ashikaga Yoshimitsu, se estaba convirtiendo en una fuerza cada vez más dominante.\n\nNacido como hijo de Kanami, líder de la troupe de sarugaku Kanze, Oniyasha atraviesa sus días con una pregunta vaga anidada en su corazón: ¿Por qué la gente baila? Su espíritu permanece nublado, hasta que un día se encuentra con una danza que es verdaderamente \"buena.\"\n\nCurioso, sensible y sorprendentemente bello, el chico conoce a gente, ríe, llora, enfrenta sus propias debilidades, y poco a poco comienza a dar forma a una nueva forma de danza para un mundo sumido en la impermanencia.",poster:null,slug:"world-is-dancing",startDate:"2026-07-02",createdAt:"2026-06-29 14:05:54.607618+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59899,number:8,createdAt:"2026-08-17T14:23:57.21101+00:00"}},{id:4405,title:"Buchigire Reijou wa Houfuku wo Chikaimashita. Madousho no Chikara de Sokoku wo Tatakitsubushimasu",synopsis:"Elizabeth Leiston, la hija del poderoso primer ministro de Haldoria, es la imagen de una noble dama refinada y la futura reina perfecta. Pero cuando su prometido la humilla públicamente, cancela su compromiso y empieza a difundir rumores desagradables sobre ella, Elizabeth llega a su punto de quiebre. ¿Por qué debería su único amigo ser su leal sirvienta, y por qué debería seguir sirviendo a un país que no la respeta? Elizabeth concluye que no lo soportará más y que derribará el reino, ¡aunque sea lo último que haga! Así, utiliza su aguda inteligencia y, lo más importante, sus siete grimorios mágicos para embarcarse en una búsqueda de venganza. ¡Y que le digan, habrá un precio muy alto que pagar! ",poster:null,slug:"buchigire-reijou-wa-houfuku-wo-chikaimashita-madousho-no-chikara-de-sokoku-wo-tatakitsubushimasu",startDate:"2026-07-06",createdAt:"2026-07-06 12:32:08.727599+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59900,number:7,createdAt:"2026-08-17T14:45:26.134379+00:00"}},{id:4407,title:"Tenkou-saki no Seiso Karen na Bishoujo ga, Mukashi Danshi to Omotte Issho ni Asonda Osananajimi Datta Ken",synopsis:"Volví a encontrarme con mi amiga de la infancia, y ella se había convertido en una hermosa e inocente chica.\n\n\"Ha pasado un tiempo, Hayato.\"\n\"¿Haruki, verdad?\"\n\nEn el pasado, solía jugar en el barro con mi amiga de la infancia en el campo, y cuando la volví a ver, no había rastro del niño travieso que pensé que era en ese entonces. Solo frente a Hayato, ella se quitó el abrigo que llevaba y reaccionó de la misma manera grosera que lo hacía en aquel entonces. La distancia entre tú y yo no ha cambiado.",poster:null,slug:"tenkou-saki-no-seiso-karen-na-bishoujo-ga-mukashi-danshi-to-omotte-issho-ni-asonda-osananajimi-datta-ken",startDate:"2026-07-06",createdAt:"2026-07-06 12:43:51.084426+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59901,number:7,createdAt:"2026-08-17T15:16:05.501775+00:00"}},{id:3941,title:"Liar Game",synopsis:"La estudiante universitaria Nao Kanzaki siempre se ha adherido al significado de su nombre: \"deshonestidad tonta\". Sin embargo, después de abrir un paquete no solicitado que contiene cien millones de yenes, acepta inadvertidamente una invitación para el \"Juego del Mentiroso\". En este torneo, se anima a los concursantes a traicionar y engañar a sus oponentes para obtener una enorme suma de dinero; por el contrario, perder conlleva una deuda de por vida. Con todas sus esperanzas perdidas, su única opción es buscar ayuda de un estafador.\n\nEse mismo día, el infame timador Shinichi Akiyama es finalmente liberado de la cárcel. Este exestudiante de psicología es conocido por haber arruinado por sí solo a una empresa entera, y Nao cree que él es su única oportunidad de escapar de su situación desesperada. Al principio, Shinichi es reacio a cometer otro crimen, ignorando a Nao y su solicitud. Pero después de ver su desesperación y persistencia, acepta ayudarla.\n\nEn este mundo fraudulento, Nao y Shinichi tienen sus propios motivos. Sin embargo, pronto ven la verdadera naturaleza no solo del juego, sino también de todos los involucrados.",poster:null,slug:"liar-game",startDate:"2026-04-07",createdAt:"2026-04-06 12:15:32.821896+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59904,number:20,createdAt:"2026-08-17T16:22:18.833703+00:00"}},{id:4410,title:"Kimi ga Shinu made Koi wo Shitai",synopsis:"La muerte de la compañera de cuarto de Sheena Totsuki es anunciada de manera casual al inicio de la clase, y el día prosigue como de costumbre. En un orfanato que cría a los niños como soldados, la muerte no es nada nuevo para los residentes. Con su país natal envuelto en una guerra que se ha prolongado durante demasiados años y que no muestra signos de detenerse, los niños de la institución son enviados a morir en el campo de batalla todos los días. A diferencia de los otros huérfanos, Sheena está profundamente perturbada por el conflicto en curso y desea que termine.\n\nEn la noche de la muerte de su compañera de cuarto, Sheena conoció a una chica cubierta de sangre que permanecía alegre a pesar de su estado. Al día siguiente, la chica aparece como una nueva estudiante en la clase de Sheena y se presenta como Mimi Kagari. Inicialmente considerada un mito escolar, se dice que Mimi es el arma secreta del orfanato: una chica que no puede morir. Asignada como la nueva compañera de cuarto de Sheena, Mimi espera llevarse bien con ella y acostumbrarse a la vida escolar.\n\nSin embargo, perturbada por la actitud despreocupada de Mimi hacia la guerra, Sheena lucha por aceptar el mundo en el que viven, todo mientras su inusual amistad florece en medio de la sombría situación. ",poster:null,slug:"kimi-ga-shinu-made-koi-wo-shitai",startDate:"2026-07-07",createdAt:"2026-07-07 12:49:16.742843+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59907,number:7,createdAt:"2026-08-18T14:06:18.016985+00:00"}},{id:3968,title:"Re:Zero kara Hajimeru Isekai Seikatsu 4th Season",synopsis:"En la mortal batalla en la Ciudad de Agua de Priestella, Subaru y sus aliados apenas lograron salir victoriosos, pero su triunfo tuvo un alto costo. A través de la \"Autoridad de la Glotonería\", Rem fue puesta en animación suspendida, mientras que los recuerdos de Crusch e incluso el nombre de Julius fueron devorados. Mientras busca una manera de salvarlos, Subaru se entera del \"sabio\" Shaula, un ser omnividente que se dice posee toda forma de conocimiento. Su próximo destino es la Torre de Vigilancia Pleiades, hogar de un sabio, la torre más lejana que se alza en el vasto y desconocido desierto conocido como las Dunas de Auguria, un lugar tan peligroso que incluso el más poderoso \"Santo de la Espada\", Reinhard, no logró conquistar. La furia de la naturaleza, bestias mágicas desconocidas y peligros inimaginables le esperan. Junto a sus amigos, Subaru emprende un viaje arriesgado por su vida para recuperar lo que se ha perdido. ",poster:null,slug:"rezero-kara-hajimeru-isekai-seikatsu-4th-season",startDate:"2026-04-08",createdAt:"2026-04-08 12:19:02.730623+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59915,number:13,createdAt:"2026-08-19T14:59:47.753336+00:00"}},{id:4342,title:"Heroine? Seijo? Iie, All Works Maid desu (Hokori)!",synopsis:"\"¡Me convertiré en la sirvienta más maravillosa del mundo!\" gritó la chica, con su falda ondeando en blanco y negro. Su nombre es Melody. Una chica japonesa reencarnada, ahora persigue su sueño en su nueva vida, trabajando como sirvienta multifuncional para la familia de un pobre conde en el reino de Théolas. Cuando ella lo logra, incluso el té barato se convierte en una bebida de lujo, y una mansión en ruinas se restaura rápidamente a su esplendor. Limpiar, servir, cazar, bricolaje—déjaselo todo a ella y a su poderosa magia.\n\nSin que Melody lo sepa, este mundo es en realidad un juego otome, y ella es la heroína más poderosa e invencible, ¡la santa! Sin embargo, ella sigue ignorando este hecho. ¿Romance con hombres guapos? ¿Ataques del Señor Demonio? ¡El trabajo es lo primero! ¡Una fantasía de trabajo malentendido que sin querer rompe el destino!",poster:null,slug:"heroine-seijo-iie-all-works-maid-desu-hokori",startDate:"2026-07-01",createdAt:"2026-06-24 15:02:09.655885+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59916,number:9,createdAt:"2026-08-19T15:00:03.942593+00:00"}},{id:4370,title:"Lv999 no Murabito",synopsis:"En este mundo, existe el concepto de niveles. Aparte de aquellos que viven de derrotar monstruos, la mayoría de las personas solo están aproximadamente entre el nivel 1 y el 5. Además, no cualquiera puede salir a cazar monstruos; esto está fuertemente influenciado por el rol que les ha asignado Dios. Hay ocho roles elegibles: Guerrero, Luchador, Clérigo, Mago, Pícaro, Comerciante, Cazador y Hechicero. Aquellos bendecidos con un poder extraordinario se dividen en tres tipos: Realeza, Héroes y Sabios. Pero para la mayoría de la población, no tienen tales poderes y viven de la agricultura o manejando tiendas. Las aldeas son desarrolladas por aquellos con el rol más débil... los aldeanos.\n\nPara los aldeanos sin poderes, salir a cazar monstruos es equivalente a cometer suicidio. Pero un día, un niño de dos años, que ha recibido el rol de aldeano, se da cuenta de algo.\n\nUna vez que derrotas a un monstruo... puedes ganar una gran riqueza.",poster:null,slug:"lv999-no-murabito",startDate:"2026-07-02",createdAt:"2026-07-01 14:19:21.832887+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59920,number:9,createdAt:"2026-08-19T16:15:38.312201+00:00"}},{id:4372,title:"Reiwa no Dara-san",synopsis:"Las nubes oscurecen el cielo y las cortinas de lluvia convierten el bosque de la montaña en un laberinto traicionero... Un deslizamiento de tierra aplasta una valla de alambre de púas y sepulta un cartel de \"PROHIBIDO EL PASO\"... Dos jóvenes hermanos se adentran en un mundo oscuro al que no pertenecen, y una larga y horrenda sombra se eleva para encontrarlos. —¡De todas formas, así es como conocimos a Dara-san! Puede parecer algo aterradora, ¡pero espera a conocerla mejor!\n\n\"¡Mira, soy un dios de la mala suerte, ¿sí?! ¿No se van a asustar estos niños por mi grotesca apariencia!?\"",poster:null,slug:"reiwa-no-dara-san",startDate:"2026-07-02",createdAt:"2026-07-02 13:45:31.896208+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:59847,number:7,createdAt:"2026-08-13T13:18:42.860417+00:00"}},{id:4421,title:"Dogulwang",synopsis:"Bajo cubierta en territorio enemigo, el nuevo plan de Jooheon para atormentar a TKBM implicará debilitarlos desde adentro. Robar sus re
